name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  regeln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regeln
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  preisdienst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build preisdienst/Lumora.Preise.csproj
